<svg viewBox="0 0 600 720" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="fm-title">
  <title id="fm-title">Ilustración aérea de parcelas de cultivo con un campo de riego circular</title>
  <defs>
    <pattern id="fm-wheat" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
      <rect width="9" height="9" fill="#dcb35a" />
      <rect width="9" height="3.5" fill="#c99a3a" />
    </pattern>
    <pattern id="fm-green" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(4)">
      <rect width="7" height="7" fill="#3d6142" />
      <rect width="7" height="3" fill="#2d4c33" />
    </pattern>
    <pattern id="fm-soil" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(84)">
      <rect width="10" height="10" fill="#8f6d4b" />
      <rect width="10" height="2" fill="#7a5b3e" />
    </pattern>
    <pattern id="fm-field" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)">
      <rect width="8" height="8" fill="#2b4a33" />
      <rect width="8" height="3" fill="#233f2b" />
    </pattern>
    <pattern id="fm-moss" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(78)">
      <rect width="8" height="8" fill="#7d8a45" />
      <rect width="8" height="3" fill="#6b7838" />
    </pattern>
    <pattern id="fm-young" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(90)">
      <rect width="12" height="12" fill="#a4a865" />
      <circle cx="6" cy="6" r="2.2" fill="#7f8a45" />
    </pattern>
    <pattern id="fm-straw" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(3)">
      <rect width="6" height="6" fill="#e7d4a4" />
      <rect width="6" height="2" fill="#d8c18a" />
    </pattern>
    <pattern id="fm-clay" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <rect width="9" height="9" fill="#b9673d" />
      <rect width="9" height="3.5" fill="#a65833" />
    </pattern>
    <clipPath id="fm-pivot-clip">
      <circle cx="425" cy="290" r="116" />
    </clipPath>
  </defs>

  <!-- Caminos entre parcelas -->
  <rect width="600" height="720" fill="#efe6d2" />

  @for (parcel of parcels; track parcel.points; let i = $index) {
    <polygon class="parcel" [attr.points]="parcel.points" [attr.fill]="parcel.fill" [style.--i]="i" />
  }

  <!-- Pivote central -->
  <g class="pivot">
    <circle cx="425" cy="290" r="116" fill="#66763a" />
    @for (r of rings; track r; let odd = $odd) {
      <circle cx="425" cy="290" [attr.r]="r" fill="none" [attr.stroke]="odd ? '#58682f' : '#7c8b47'" stroke-width="5" />
    }
    <g clip-path="url(#fm-pivot-clip)">
      <g class="pivot__arm">
        <path d="M425 290 L425 174 A116 116 0 0 0 367 189.5 Z" fill="#2c4a2a" opacity="0.35" />
        <line x1="425" y1="290" x2="425" y2="174" stroke="#f3eee2" stroke-width="2" />
      </g>
    </g>
    <circle cx="425" cy="290" r="5" fill="#f3eee2" />
  </g>

  <!-- Cortina rompevientos -->
  <g class="trees">
    @for (tree of trees; track $index) {
      <circle [attr.cx]="tree.x" [attr.cy]="tree.y" [attr.r]="tree.r" fill="#1f3a2a" />
    }
  </g>

  <!-- Anotación de cuaderno de campo -->
  <g class="note" font-family="IBM Plex Mono, monospace">
    <circle cx="398" cy="494" r="10" fill="none" stroke="#1a1f17" stroke-width="1.5" />
    <circle cx="398" cy="494" r="2.5" fill="#1a1f17" />
    <path d="M408 488 L428 474" stroke="#1a1f17" stroke-width="1.5" />
    <rect x="428" y="458" width="164" height="28" fill="#1a1f17" />
    <text x="438" y="476.5" font-size="11" letter-spacing="0.6" fill="#f3eee2">CADA CULTIVO, UN RETO</text>
  </g>

  <!-- Norte -->
  <g class="north" fill="#f3eee2" font-family="IBM Plex Mono, monospace">
    <path d="M566 52 L572 36 L578 52 L572 48 Z" />
    <text x="566.5" y="70" font-size="12">N</text>
  </g>
</svg>
